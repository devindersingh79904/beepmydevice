# nginx for the dashboard container.
#
# Serves the built SPA and proxies the two API paths to the backend, so the
# browser sees a single origin. That is what makes the app's default
# configuration (`/api/v1`, `/ws/status`) work with no environment at all: no
# CORS preflight, no cross-origin cookie rules, and a wss:// socket that
# inherits the page's TLS rather than needing its own certificate.

upstream beepmydevice_api {
    # `api` is the service name in docker/docker-compose.yml. Change it when
    # running the container against an API somewhere else.
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The bundle is not large, but the HTML and the JSON responses compress well.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The dashboard is behind a login and holds device names and MAC addresses.
    # Not sensitive enough for a strict CSP to be worth the maintenance, but
    # these three cost nothing.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Hashed assets are immutable: the filename changes when the content does,
    # so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fonts are not content-hashed (they are copied from public/), so they get
    # a long but revalidating cache rather than an immutable one.
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # The trailing slash on proxy_pass is load-bearing: it replaces the matched
    # `/api/v1/` prefix rather than appending to it, so `/api/v1/auth/login`
    # reaches the API as `/auth/login`. The backend mounts its routers at the
    # root; the prefix exists only so the browser can tell an endpoint from
    # this dashboard's own `/devices` and `/alerts` pages. Drop the slash and
    # every request 404s.
    location /api/v1/ {
        proxy_pass http://beepmydevice_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://beepmydevice_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The status socket is long-lived and mostly idle -- a device that is
        # simply not moving sends nothing for minutes at a time. nginx's 60s
        # default would drop it and force a reconnect on a working connection.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # index.html itself must never be cached, or a browser keeps loading the
    # old one and asking for asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: /devices and /alerts are React Router paths, not
    # files. Without this, a reload on any route but / is a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
