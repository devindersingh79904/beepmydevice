services:
  db:
    # 17 to match the deployed database. The suite was run against
    # PostgreSQL 17.11 -- 98 passed, both migrations applied -- so this is
    # a verified version, not an assumed-compatible one.
    image: postgres:17-alpine
    container_name: beepmydevice-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beepmydevice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beepmydevice}
      POSTGRES_DB: ${POSTGRES_DB:-beepmydevice_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this so migrations never run against a cold database.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beepmydevice}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      # backend/Dockerfile, the conventional location. Platforms that build
      # from a repo (EasyPanel, Railway, Render) look for `Dockerfile` at the
      # build path by default, and a Dockerfile tucked in a subdirectory is a
      # setting each of them spells differently -- or, on some, cannot express
      # at all. The entrypoint and this compose file stay in docker/.
      dockerfile: Dockerfile
    container_name: beepmydevice-api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beepmydevice}:${POSTGRES_PASSWORD:-beepmydevice}@db:5432/${POSTGRES_DB:-beepmydevice_dev}
      # Empty: log to stdout only, which is where `docker logs` and every
      # hosting platform read from. A log file inside a container is written to
      # a layer that is discarded when the container is replaced, so the lines
      # you most want after a crash are the ones guaranteed to be gone.
      LOG_FILE_PATH: ""
      # Compose is the "just bring it up" path, so it migrates on start. A
      # production deploy leaves this unset and runs the step explicitly --
      # see docs/DEPLOYMENT.md for why that distinction is kept.
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    # The admin dashboard. Its own Dockerfile lives beside its source in
    # web/ -- it is a separate deployable with a separate toolchain, and
    # keeping the build file with the thing it builds is what lets it be
    # built and shipped without this compose file at all:
    #
    #   docker build -t beepmydevice-web ./web
    build:
      context: ../../web
      dockerfile: Dockerfile
      # Left unset on purpose. Vite inlines VITE_* at build time, and the
      # defaults are same-origin paths (/api/v1, /ws/status) which the
      # container's own nginx proxies to `api` below. Passing an absolute URL
      # here would bake one host into the image.
      args: {}
    container_name: beepmydevice-web
    ports:
      # 8080 rather than 80: the host's port 80 is usually taken, and a
      # dashboard that will not start because of that is a confusing first
      # experience.
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
