[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beepmydevice-backend"
version = "1.0.0"
description = "WiFi-based cross-account device alert system — FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Devinder Singh" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pylint.main]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    # The codebase logs with f-strings throughout, including the helpers in
    # src/utils/logger.py. Consistency beats the marginal saving of deferring
    # interpolation for log lines that are almost always emitted.
    "logging-fstring-interpolation",
    # SQLAlchemy 2.0 false positives: pylint cannot follow Mapped[...] generics
    # or the func.* call factory, and reports both as hard errors.
    "unsubscriptable-object",
    "not-callable",
    # ORM models and Pydantic schemas are declarative data classes; a public
    # method count is not a meaningful measure of them.
    "too-few-public-methods",
    # Two tables that both hang off wifi_networks declare the same foreign key
    # the same way, and that is the schema being consistent rather than a
    # duplication to factor out. A shared mixin would couple `devices` and
    # `discovered_devices` -- one a thing that can be alerted, the other a
    # sighting that never can -- purely to save five lines.
    "duplicate-code",
]

[tool.pylint.design]
# Enforces the standards in docs/CODING_STANDARDS.md.
max-statements = 20
max-args = 6

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
