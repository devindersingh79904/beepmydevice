name: Deploy

# Manual only. An automatic deploy on every push to master would ship a
# migration before anyone has looked at it.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f backend/docker/Dockerfile -t beepmydevice-backend:${{ github.sha }} backend/

