name: Backend Tests

on:
  push:
    branches: [master]
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-tests.yml']

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Kept in step with docker/docker-compose.yml and the deployed
        # database. CI must not test against a different major version
        # than production runs.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beepmydevice
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beepmydevice
      # Named explicitly so the suite does not derive "<db>_test" and end up
      # creating beepmydevice_test_test.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beepmydevice_test
      # Not a real secret: a CI-only value that satisfies the startup check.
      SECRET_KEY: ci-test-key-not-used-outside-this-workflow
      ENVIRONMENT: test
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Applied against the main database, not the test one: the suite builds
      # its own schema from the models, so this step exists to catch a model
      # change that nobody wrote a migration for.
      - name: Migrations apply cleanly
        run: python -m alembic upgrade head

      - name: Format check
        run: black --check src/

      - name: Lint
        run: pylint src/

      - name: Type check
        run: mypy src/

      - name: Test
        run: pytest --cov=src --cov-report=term-missing
